# Docker Compose file for Lucky Stars API + database.
#
# Copy .env.example to .env and fill it in first: the secrets (database password, JWT secret,
# email key) come from there and are never committed.
#
# Intended for local testing and a first deployment. For a real deployment put a reverse proxy
# with HTTPS in front of `app` (see README, "HTTPS").
#
#   Build images: docker compose build
#      Start all: docker compose up
#       Stop all: docker compose down (add -v to wipe the database)
#

volumes:
  db_data:

x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_HOST: db
  DB_PORT: 3306
  DB_NAME: ${DB_NAME:-luckystars}
  DB_USERNAME: ${DB_USERNAME:-luckystars}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  BREVO_SENDER: ${BREVO_SENDER:-}
  TRUST_PROXY: ${TRUST_PROXY:-false}

services:
  app:
    image: luckystars-back:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'
    # user: '0' # uncomment to run as root for testing purposes even though Dockerfile defines 'vapor' user.
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]

  db:
    # The production database is MariaDB 10.4, so use MariaDB here too.
    image: mariadb:10.11
    volumes:
      - db_data:/var/lib/mysql
      # Runs only the first time, when the data volume is empty.
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./Database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    environment:
      MARIADB_USER: ${DB_USERNAME:-luckystars}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-luckystars}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No `ports:` on purpose: only the app container can reach the database.
